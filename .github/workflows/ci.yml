name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run E2E tests
        run: npm test

      - name: Audit and verify showcase examples
        run: |
          for dir in examples/*; do
            if [ -d "$dir" ]; then
              echo "::group::Validating $dir"
              node dist/cli.js audit "$dir" --strict
              node dist/cli.js verify "$dir" --mode local --runs 2
              echo "::endgroup::"
            fi
          done

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Verify SKILL.md frontmatter
        run: |
          head -n 5 skill/evalkit/SKILL.md | grep -q "^name: evalkit$"
          head -n 5 skill/evalkit/SKILL.md | grep -q "^description:"
